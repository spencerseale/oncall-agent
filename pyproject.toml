[project]
name = "oncall-agent"
version = "1.0.0"
description = "LangGraph incident-response agent — telemetry, deploys, runbooks, and precedent, instrumented with Braintrust"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "openai>=1.60.0",
    "braintrust>=0.2.0",
    "httpx>=0.27.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.1",
    "autoevals>=0.3.0",
    "pydantic>=2.0.0",
]

[project.scripts]
oncall = "oncall_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall_agent"]

[tool.uv]
package = true
